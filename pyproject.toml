[project]
name = "splitema"
version = "0.1.0"
description = "Training and inference code for SplitEMA language and proteomics experiments"
requires-python = ">3.11,<3.12"

dependencies = [
    "torch==2.10.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "datasets==3.6.0",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "tqdm>=4.0",
    "transformers>=4.53,<5.0",
    "linformer>=0.2.3,<0.3",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [
    "src",
    "src/data",
    "src/models",
    "src/train",
    "theoretical_spectrum_processing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
